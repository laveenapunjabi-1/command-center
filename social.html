<style>
  :root { --cream:#FFFDF7; --cream-2:#FFFBF4; --ink:#2C261D; --muted:#8A8072; --soft:#B5AC9B; --line:#E5DCC9; --line-2:#EAE2D2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; position:relative; overflow-x:hidden; }
  .wrap { max-width:1280px; margin:0 auto; padding:28px 32px 40px; position:relative; z-index:1; }

  .ws { display:flex; align-items:center; gap:10px; margin-bottom:22px; position:relative; }
  .ws-icon { width:34px; height:34px; border-radius:10px; background:#7A4FBF; color:#FFFBF4; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .ws-name { font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:8px; padding:7px 14px; background:#fff; border:1px solid var(--line); border-radius:999px; }
  .ws-name:hover { border-color:var(--soft); }
  .ws-name span { font-size:13px; color:#7A4FBF; }
  .ws-menu { display:none; position:absolute; top:44px; left:44px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:6px; min-width:190px; z-index:100; box-shadow:0 10px 30px rgba(44,38,29,0.1); }
  .ws-menu a, .ws-menu b { display:block; font-size:13px; padding:9px 12px; border-radius:8px; color:var(--ink); text-decoration:none; font-weight:400; }
  .ws-menu b { background:var(--cream-2); font-weight:700; }
  .ws-menu a:hover { background:var(--cream-2); }

  h1 { font-size:34px; font-weight:700; letter-spacing:-0.02em; }
  .headrow { display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-top:16px; }
  .pills { display:flex; gap:10px; flex-wrap:wrap; }
  .pill { font-size:13px; color:var(--ink); border:1px solid var(--line); padding:7px 16px; border-radius:999px; background:var(--cream-2); }
  .headright { display:flex; align-items:center; gap:16px; }
  .sharelink { font-size:13px; color:var(--muted); text-decoration:underline; cursor:pointer; }
  .toggle { display:flex; background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px; }
  .toggle button { font-family:inherit; font-size:13.5px; font-weight:500; padding:8px 20px; border:none; border-radius:999px; background:transparent; color:var(--muted); cursor:pointer; }
  .toggle button.on { background:var(--ink); color:var(--cream); }

  .modal .actions { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
  .btn { font-family:inherit; font-size:13px; font-weight:500; padding:9px 16px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .btn:hover { border-color:var(--soft); }
  .btn.primary { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .btn.danger { color:#A32D2D; }
  .btn.subtle { border:none; background:none; color:var(--muted); text-decoration:underline; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--cream); font-size:13px; padding:10px 20px; border-radius:999px; opacity:0; transition:opacity .2s; z-index:60; pointer-events:none; }

  .decor-band .quote em { font-style:normal; color:#F2C13D; }

  @media (max-width:800px) {
    .wrap { padding:22px 16px 40px; }
    .vitals-body { grid-template-columns:1fr; }
    .vital + .vital { border-left:none; border-top:1px solid var(--line-2); }
    .decor.top-right { width:180px; top:10px; }
    .decor-band .quote { font-size:32px; }

</style>

<script>

const PALETTES = {
  'editorial cream':  { li:'#1D4E9E', ig:'#C22069', km:'#B3502B', purple:'#7A4FBF', tint:5,  border:16 },
  'sunlit pop':       { li:'#2456E0', ig:'#E5147E', km:'#EF5B25', purple:'#8A4DE8', tint:8,  border:22 },
  'electric sherbet': { li:'#3D53F5', ig:'#FF2D92', km:'#FF7A1A', purple:'#9D4EFF', tint:11, border:26 },
  'riso brights':     { li:'#0057D8', ig:'#D9006C', km:'#D64200', purple:'#6B4EFF', tint:13, border:30 },
  'flower power':     { li:'#3A4FD8', ig:'#E8309A', km:'#F08C00', purple:'#8B5CF6', tint:16, border:38 }
};
const TYPE_ICON = { text:'\u270E', carousel:'\u25A3', reel:'\u25B6', image:'\u25CF' };

let channels = [], ideas = [], statusLines = [];
let view = 'boards';
let palette = localStorage.getItem('shq_palette') || 'editorial cream';
let backdrop = localStorage.getItem('shq_backdrop') !== 'off';
let vitalsCollapsed = localStorage.getItem('shq_vitals') === 'collapsed';
let postedExpanded = {}, killedExpanded = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pal = () => PALETTES[palette] || PALETTES['editorial cream'];
const chColor = (ch) => pal()[ch.color_key];
const mix = (c, p, base) => `color-mix(in oklab, ${c} ${p}%, ${base})`;
const cardBg = (ch) => mix(chColor(ch), pal().tint, '#FFFFFF');
const cardBorder = (ch) => mix(chColor(ch), pal().border, '#EAE2D2');
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-IN', { month:'short', day:'numeric' }) : '';
const fmtDow = (d) => d ? new Date(d).toLocaleDateString('en-IN', { weekday:'short', month:'short', day:'numeric' }) : '';
const fmtDateTime = (d) => {
  if (!d) return '';
  const dt = new Date(d);
  const base = dt.toLocaleDateString('en-IN', { weekday:'short', month:'short', day:'numeric' });
  const hasTime = dt.getHours() !== 0 || dt.getMinutes() !== 0;
  return hasTime ? `${base} \u00B7 ${dt.toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit', hour12:false })}` : base;
};
const daysSince = (d) => d ? Math.floor((Date.now() - new Date(d).getTime()) / 86400000) : null;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

function channelState(ch) {
  const chIdeas = ideas.filter(i => i.channel_id === ch.id);
  const live = chIdeas.filter(i => !i.posted_at && !i.killed_at);
  const lastPosted = chIdeas.filter(i => i.posted_at).map(i => i.posted_at).sort().pop();
  const n = daysSince(lastPosted);
  const stale = live.find(i => i.owner === 'team' && daysSince(i.updated_at) >= 4);
  const moved = live.filter(i => daysSince(i.updated_at) <= 7).length;
  if (stale) return { state:'handoff_pending', n: daysSince(stale.updated_at) };
  if (n === null || n > ch.cadence_target_days * 2) return { state:'quiet', n: n ?? '\u221E' };
  if (n > ch.cadence_target_days) return { state:'drifting', n };
  if (moved >= 3) return { state:'cooking', n };
  return { state:'healthy', n };
}
function statusLine(ch) {
  const { state, n } = channelState(ch);
  const opts = statusLines.filter(l => l.channel_id === ch.id && l.state === state && l.active);
  if (!opts.length) return '';
  const seed = Math.floor(Date.now() / 86400000);
  return opts[seed % opts.length].line.replace('{n}', n);
}

async function load() {
  const [chRes, idRes, slRes] = await Promise.all([
    db.from('social_channels').select('*').order('sort_order'),
    db.from('social_ideas').select('*').order('created_at'),
    db.from('social_status_lines').select('*')
  ]);
  if (chRes.error || idRes.error || slRes.error) {
    toast('Could not load \u2014 check connection'); console.error(chRes.error || idRes.error || slRes.error); return;
  }
  channels = chRes.data; ideas = idRes.data; statusLines = slRes.data;
  render();
}

function render() {
  document.body.classList.toggle('backdrop-on', backdrop);
  $('backdropToggle').checked = backdrop;
  $('paletteSelect').innerHTML = Object.keys(PALETTES).map(p => `<option ${p === palette ? 'selected' : ''}>${p}</option>`).join('');
  renderHeader(); renderVitals(); renderBoards(); renderCalendar();
  $('boards').classList.toggle('off', view !== 'boards');
  $('calendar').classList.toggle('on', view === 'calendar');
  $('viewBoards').classList.toggle('on', view === 'boards');
  $('viewCalendar').classList.toggle('on', view === 'calendar');
}

function renderHeader() {
  const alive = ideas.filter(i => !i.posted_at && !i.killed_at).length;
  const now = new Date(); const weekEnd = new Date(now.getTime() + 7 * 86400000);
  const sched = ideas.filter(i => i.scheduled_at && !i.posted_at && !i.killed_at && new Date(i.scheduled_at) >= now && new Date(i.scheduled_at) <= weekEnd).length;
  const killed = ideas.filter(i => i.killed_at).length;
  $('headerPills').innerHTML = `
    <span class="pill">${alive} ideas alive</span>
    <span class="pill">${sched} scheduled this week</span>
    <span class="pill">${killed} killed, still mourned</span>`;
  const shared = ideas.filter(i => i.share_token && !i.killed_at).sort((a,b) => (b.updated_at||'').localeCompare(a.updated_at||''));
  const link = $('shareLink');
  if (shared.length) {
    link.style.display = '';
    link.onclick = () => window.open(`share.html?t=${shared[0].share_token}`, '_blank');
  } else link.style.display = 'none';
}

function renderVitals() {
  $('vitalsPeek').textContent = vitalsCollapsed ? '\u25BE expand' : '\u25B4 collapse';
  $('vitalsPeek').onclick = () => { vitalsCollapsed = !vitalsCollapsed; localStorage.setItem('shq_vitals', vitalsCollapsed ? 'collapsed' : 'open'); render(); };
  $('vitalsBody').style.display = vitalsCollapsed ? 'none' : 'grid';
  if (vitalsCollapsed) return;
  const y = new Date().getFullYear(), m = new Date().getMonth();
  $('vitalsBody').innerHTML = channels.map(ch => {
    const posted = ideas.filter(i => i.channel_id === ch.id && i.posted_at).sort((a,b) => a.posted_at.localeCompare(b.posted_at));
    const last = posted[posted.length - 1];
    const next = ideas.filter(i => i.channel_id === ch.id && i.scheduled_at && !i.posted_at && !i.killed_at).sort((a,b) => a.scheduled_at.localeCompare(b.scheduled_at))[0];
    const month = posted.filter(i => { const d = new Date(i.posted_at); return d.getFullYear() === y && d.getMonth() === m; }).length;
    const year = posted.filter(i => new Date(i.posted_at).getFullYear() === y).length;
    const c = chColor(ch);
    return `<div class="vital">
      <div class="vname"><i style="background:${c}"></i>${esc(ch.name)}</div>
      <div class="vrow"><span>last post</span><b>${last ? esc(last.title) + ' \u00B7 ' + fmtDate(last.posted_at) : '\u2014'}</b></div>
      <div class="vrow"><span>next scheduled</span><b>${next ? fmtDateTime(next.scheduled_at) : '\u2014'}</b></div>
      <div class="vstats">
        <div class="vstat" style="background:${mix(c, 7, '#FFFFFF')}"><b style="color:${c}">${month}</b><span>posts this month</span></div>
        <div class="vstat" style="background:${mix(c, 7, '#FFFFFF')}"><b style="color:${c}">${year}</b><span>posts this year</span></div>
      </div>
    </div>`;
  }).join('');
}

function chipHtml(i) {
  const chips = [];
  if (i.voice_note_url || i.voice_note_duration) chips.push(`<span class="chip">\u25C9 voice note${i.voice_note_duration ? ' ' + esc(i.voice_note_duration) : ''}</span>`);
  if (i.album_url) chips.push(`<span class="chip">\uD83D\uDCCE album${i.photo_count ? ' \u00B7 ' + i.photo_count + ' photos' : ''}</span>`);
  if (i.scheduled_at && !i.posted_at) chips.push(`<span class="chip">\u25F7 ${fmtDateTime(i.scheduled_at)}</span>`);
  if (i.owner === 'team') chips.push(`<span class="chip team">team${i.share_token ? ' \u00B7 link shared' : ''}${i.share_status === 'in_progress' ? ' \u00B7 in progress' : i.share_status === 'done' ? ' \u00B7 sent back' : ''}</span>`);
  return chips.length ? `<div class="chips">${chips.join('')}</div>` : '';
}

function renderBoards() {
  $('boards').innerHTML = channels.map(ch => {
    const live = ideas.filter(i => i.channel_id === ch.id && !i.posted_at && !i.killed_at);
    const posted = ideas.filter(i => i.channel_id === ch.id && i.posted_at).sort((a,b) => b.posted_at.localeCompare(a.posted_at));
    const killed = ideas.filter(i => i.channel_id === ch.id && i.killed_at).sort((a,b) => b.killed_at.localeCompare(a.killed_at));
    const stageCols = ch.stages.map(st => {
      const cards = live.filter(i => i.stage === st);
      const inner = cards.length
        ? cards.map(i => `<div class="card ${i.owner === 'team' ? 'with-team' : ''}" style="background:${cardBg(ch)};border-color:${cardBorder(ch)}" onclick="openIdea('${i.id}')">
            <div class="title">${esc(i.title)}</div>${chipHtml(i)}</div>`).join('')
        : `<div class="empty">\u2014</div>`;
      return `<div class="stage ${cards.length ? '' : 'ghost'}"><div class="stage-head"><b>${esc(st)}</b><span>${cards.length || ''}</span></div>${inner}</div>`;
    }).join('');
    const pOpen = postedExpanded[ch.id];
    const pShown = pOpen ? posted.slice(0, 15) : posted.slice(0, 3);
    const pLabel = pOpen ? 'show fewer' : (posted.length > 15 ? 'show last 15 of ' + posted.length : 'show all ' + posted.length);
    const postedCol = `<div class="stage ${posted.length ? '' : 'ghost'}"><div class="stage-head"><b>Posted</b><span>${posted.length || ''}</span></div>
      <div class="${pOpen ? 'colscroll' : ''}">${posted.length ? pShown.map(i => `<div class="card posted" onclick="openIdea('${i.id}')">
        <div class="title">${esc(i.title)}</div><div class="chips"><span class="chip">\u2713 posted ${fmtDate(i.posted_at)}</span></div></div>`).join('') : '<div class="empty">\u2014</div>'}</div>
      ${posted.length > 3 ? `<button class="more" onclick="togglePosted('${ch.id}')">${pLabel}</button>` : ''}</div>`;
    const kOpen = killedExpanded[ch.id];
    const kShown = kOpen ? killed.slice(0, 15) : killed.slice(0, 3);
    const kLabel = kOpen ? 'show fewer' : (killed.length > 15 ? 'show last 15 of ' + killed.length : 'show all ' + killed.length);
    const killedCol = `<div class="stage ${killed.length ? '' : 'ghost'}"><div class="stage-head"><b>Killed</b><span>${killed.length || ''}</span></div>
      <div class="${kOpen ? 'colscroll' : ''}">${killed.length ? kShown.map(i => `<div class="card ended" style="border-color:${cardBorder(ch)}" onclick="openIdea('${i.id}')">
        <div class="title">${esc(i.title)}</div><div class="chips"><span class="chip">\u2715 ${esc(i.killed_reason || 'killed')} \u00B7 ${fmtDate(i.killed_at)}</span></div></div>`).join('') : '<div class="empty">\u2014</div>'}</div>
      ${killed.length > 3 ? `<button class="more" onclick="toggleKilled('${ch.id}')">${kLabel}</button>` : ''}</div>`;
    return `<section class="channel">
      <div class="band" style="background:${chColor(ch)}">
        <span class="mono">${esc(ch.mono)}</span>
        <h2>${esc(ch.name)}</h2>
        <span class="status">${esc(statusLine(ch))}</span>
        <span class="count">${live.length} ideas</span>
        <button class="add" onclick="openNew('${ch.id}')" title="add idea">+</button>
      </div>
      <div class="stages">${stageCols}${postedCol}${killedCol}</div>
    </section>`;
  }).join('');
}

function renderCalendar() {
  const now = new Date();
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7)); monday.setHours(0,0,0,0);
  const days = Array.from({ length:14 }, (_, k) => new Date(monday.getTime() + k * 86400000));
  $('calRange').textContent = `${days[0].toLocaleDateString('en-IN', { month:'short', day:'numeric' })} \u2013 ${days[13].toLocaleDateString('en-IN', { month:'short', day:'numeric' })}`;
  $('calDays').innerHTML = `<span></span>` + days.map(d =>
    `<div class="cal-day ${d.toDateString() === now.toDateString() ? 'today' : ''}"><div class="dow">${d.toLocaleDateString('en-IN', { weekday:'short' }).slice(0,2)}</div><div class="num">${d.getDate()}</div></div>`).join('');
  $('calLanes').innerHTML = channels.map(ch => {
    const cells = days.map(d => {
      const dayIdeas = ideas.filter(i => {
        if (i.killed_at || i.channel_id !== ch.id) return false;
        const when = i.posted_at || i.scheduled_at;
        return when && new Date(when).toDateString() === d.toDateString();
      });
      if (!dayIdeas.length) return `<div class="cal-cell"></div>`;
      const i = dayIdeas[0];
      return `<div class="cal-chip" title="${esc(i.title)}" onclick="openIdea('${i.id}')"
        style="background:${mix(chColor(ch), i.posted_at ? 8 : 18, '#FFFFFF')};color:${chColor(ch)};${i.posted_at ? 'opacity:.55;' : ''}">${TYPE_ICON[i.content_type] || '\u270E'}${dayIdeas.length > 1 ? '+' : ''}</div>`;
    }).join('');
    return `<div class="cal-lane"><span class="lname" style="color:${chColor(ch)}">${esc(ch.name)}</span>${cells}</div>`;
  }).join('');
}

function modalForm(ch, idea) {
  return `
    <h3 style="color:${chColor(ch)}">${idea ? 'Edit idea' : 'New idea'} \u00B7 ${esc(ch.name)}</h3>
    <div class="field"><label>Title</label><input id="fTitle" value="${esc(idea?.title || '')}"></div>
    <div class="field"><label>Concept / brief</label><textarea id="fConcept">${esc(idea?.concept || '')}</textarea></div>
    <div class="row2">
      <div class="field"><label>Stage</label><select id="fStage">${ch.stages.map(s => `<option ${idea?.stage === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
      <div class="field"><label>Owner</label><select id="fOwner">
        <option value="me" ${(!idea || idea.owner === 'me') ? 'selected' : ''}>me</option>
        <option value="team" ${idea?.owner === 'team' ? 'selected' : ''}>team</option>
      </select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Type</label><select id="fType"><option value="">\u2014</option>${['text','image','carousel','reel'].map(t => `<option ${idea?.content_type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Scheduled</label><input id="fSched" type="datetime-local" value="${idea?.scheduled_at ? new Date(new Date(idea.scheduled_at).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0,16) : ''}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Photo album link</label><input id="fAlbum" placeholder="Google Photos link" value="${esc(idea?.album_url || '')}"></div>
      <div class="field"><label>Photo count</label><input id="fCount" type="number" value="${idea?.photo_count ?? ''}"></div>
    </div>
    <div class="field"><label>Needed by (for team)</label><input id="fNeeded" type="date" value="${idea?.needed_by || ''}"></div>`;
}

window.openNew = (chId) => {
  const ch = channels.find(c => c.id === chId);
  $('modal').innerHTML = modalForm(ch) + `
    <div class="actions">
      <button class="btn primary" onclick="saveIdea('${chId}', null)">Add idea</button>
      <button class="btn subtle" onclick="closeModal()">cancel</button>
    </div>`;
  $('overlay').classList.add('open');
};

window.openIdea = (id) => {
  const idea = ideas.find(i => i.id === id);
  const ch = channels.find(c => c.id === idea.channel_id);
  const shareBits = idea.share_token
    ? `<button class="btn" onclick="copyShare('${id}')">Copy team link</button><button class="btn subtle" onclick="revokeShare('${id}')">revoke link</button>`
    : `<button class="btn" onclick="makeShare('${id}')">Share with team</button>`;
  const lifeBits = idea.killed_at
    ? `<button class="btn" onclick="resurrect('${id}')">Resurrect</button>`
    : idea.posted_at
      ? `<button class="btn" onclick="unpost('${id}')">Un-mark posted</button>`
      : `<button class="btn" onclick="markPosted('${id}')">Mark posted \u2713</button><button class="btn danger" onclick="killIdea('${id}')">Kill it</button>`;
  $('modal').innerHTML = modalForm(ch, idea) + `
    <div class="actions">
      <button class="btn primary" onclick="saveIdea('${ch.id}', '${id}')">Save</button>
      ${lifeBits}${shareBits}
      <button class="btn subtle" onclick="closeModal()">close</button>
    </div>`;
  $('overlay').classList.add('open');
};

window.closeModal = () => $('overlay').classList.remove('open');
$('overlay').addEventListener('click', (e) => { if (e.target === $('overlay')) closeModal(); });
document.addEventListener('click', (e) => { if (!e.target.closest('.ws')) $('wsMenu').style.display = 'none'; });

function formData() {
  const sched = $('fSched').value;
  return {
    title: $('fTitle').value.trim(),
    concept: $('fConcept').value.trim() || null,
    stage: $('fStage').value,
    owner: $('fOwner').value,
    content_type: $('fType').value || null,
    scheduled_at: sched ? new Date(sched).toISOString() : null,
    album_url: $('fAlbum').value.trim() || null,
    photo_count: $('fCount').value ? parseInt($('fCount').value) : null,
    needed_by: $('fNeeded').value || null,
    posted_at: $('fPosted').value ? new Date($('fPosted').value + 'T12:00:00').toISOString() : null
  };
}

window.saveIdea = async (chId, id) => {
  const data = formData();
  if (!data.title) { toast('A title, at minimum'); return; }
  const res = id ? await db.from('social_ideas').update(data).eq('id', id)
                 : await db.from('social_ideas').insert({ ...data, channel_id: chId });
  if (res.error) { toast('Save failed'); console.error(res.error); return; }
  closeModal(); toast(id ? 'Saved' : 'Idea banked'); load();
};
window.markPosted = async (id) => { await db.from('social_ideas').update({ posted_at: new Date().toISOString() }).eq('id', id); closeModal(); toast('Posted \u2713'); load(); };
window.unpost = async (id) => { await db.from('social_ideas').update({ posted_at: null }).eq('id', id); closeModal(); load(); };
window.killIdea = async (id) => {
  const reason = window.prompt('Cause of death? (optional, shows on the board)') || null;
  let res = await db.from('social_ideas').update({ killed_at: new Date().toISOString(), killed_reason: reason }).eq('id', id);
  if (res.error) res = await db.from('social_ideas').update({ killed_at: new Date().toISOString() }).eq('id', id);
  closeModal(); toast('To the killed column'); load();
};
window.resurrect = async (id) => {
  let res = await db.from('social_ideas').update({ killed_at: null, killed_reason: null }).eq('id', id);
  if (res.error) res = await db.from('social_ideas').update({ killed_at: null }).eq('id', id);
  closeModal(); toast('It lives'); load();
};
window.makeShare = async (id) => {
  const token = crypto.randomUUID().replace(/-/g, '');
  await db.from('social_ideas').update({ share_token: token, share_status: 'sent', owner: 'team' }).eq('id', id);
  await navigator.clipboard.writeText(shareUrl(token)).catch(() => {});
  closeModal(); toast('Team link copied'); load();
};
window.copyShare = async (id) => {
  const idea = ideas.find(i => i.id === id);
  await navigator.clipboard.writeText(shareUrl(idea.share_token)).catch(() => {});
  toast('Link copied');
};
window.revokeShare = async (id) => {
  await db.from('social_ideas').update({ share_token: null, share_status: null }).eq('id', id);
  closeModal(); toast('Link revoked'); load();
};
const shareUrl = (token) => `${location.origin}${location.pathname.replace(/social\.html$/, '')}share.html?t=${token}`;

window.togglePosted = (chId) => { postedExpanded[chId] = !postedExpanded[chId]; render(); };
window.toggleKilled = (chId) => { killedExpanded[chId] = !killedExpanded[chId]; render(); };
$('viewBoards').onclick = () => { view = 'boards'; render(); };
$('viewCalendar').onclick = () => { view = 'calendar'; render(); };
$('paletteSelect').onchange = (e) => { palette = e.target.value; localStorage.setItem('shq_palette', palette); render(); };
$('backdropToggle').onchange = (e) => { backdrop = e.target.checked; localStorage.setItem('shq_backdrop', backdrop ? 'on' : 'off'); render(); };

load();
</script>
