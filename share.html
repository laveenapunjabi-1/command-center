<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social HQ · Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root { --cream:#FFFDF7; --cream-2:#FFFBF4; --ink:#2C261D; --muted:#8A8072; --line:#E5DCC9; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--ink); min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center; padding:32px 16px; }
  .sheet { width:100%; max-width:480px; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--cream-2); }
  .band { padding:14px 20px; display:flex; align-items:center; gap:10px; color:#FFFBF4; }
  .band .type { font-size:12.5px; font-weight:700; letter-spacing:0.04em; }
  .band .needed { margin-left:auto; font-size:12px; opacity:0.9; }
  .body { padding:20px; }
  h1 { font-size:20px; font-weight:700; letter-spacing:-0.01em; margin-bottom:10px; }
  .brief { font-size:14px; line-height:1.65; color:var(--muted); white-space:pre-wrap; margin-bottom:16px; }
  audio { width:100%; margin-bottom:16px; }
  .album {
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    font-family:inherit; font-size:14px; font-weight:500; color:#FFFBF4; text-decoration:none;
    padding:13px; border-radius:12px; margin-bottom:14px;
  }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .actions button {
    font-family:inherit; font-size:13px; font-weight:500; padding:11px; border-radius:12px;
    border:1px solid var(--line); background:var(--cream); color:var(--ink); cursor:pointer;
  }
  .actions button:hover { border-color:#B5AC9B; }
  .actions button.active { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .foot { text-align:center; font-size:11.5px; color:#B5AC9B; padding:14px 20px 18px; }
  .tomb { text-align:center; padding:60px 24px; }
  .tomb h1 { margin-bottom:8px; }
  .tomb p { font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<div class="sheet" id="sheet"><div class="tomb"><p>loading the brief…</p></div></div>
<script>
/* ============ CONFIG — same values as social.html ============ */
const SUPABASE_URL = 'https://neqxgfngmsysojsppjob.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lcXhnZm5nbXN5c29qc3Bwam9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDU1NzYsImV4cCI6MjA5NDY4MTU3Nn0.olSbNYgyt_90O5m4T4_j4Z80K0Av1FJFua9UF-0LCw0';
/* ============================================================== */
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const COLORS = { li:'#1D4E9E', ig:'#C22069', km:'#B3502B' };
const esc = (s) => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-IN',{weekday:'short',month:'short',day:'numeric'}) : '';
let idea = null;

async function load() {
  const token = new URLSearchParams(location.search).get('t');
  if (!token) return tomb('No brief here', 'This link is missing its token.');
  const { data, error } = await db.from('social_ideas')
    .select('*, social_channels(name, mono, color_key)').eq('share_token', token).maybeSingle();
  if (error || !data) return tomb('Nothing here', 'This link may have been revoked. Check with Laveena.');
  if (data.killed_at) return tomb('This one didn\u2019t make it', 'The idea was retired. No action needed \u2014 thank you!');
  idea = data;
  render();
}

function tomb(title, msg) {
  document.getElementById('sheet').innerHTML =
    `<div class="tomb"><h1>${esc(title)}</h1><p>${esc(msg)}</p></div>`;
}

function render() {
  const ch = idea.social_channels;
  const color = COLORS[ch.color_key] || '#2C261D';
  const statusText = idea.share_status === 'in_progress' ? 'marked in progress \u2014 thank you!'
    : idea.share_status === 'done' ? 'marked done \u2014 Laveena has been signalled \u2713'
    : 'shared by Laveena \u00B7 this page updates live \u00B7 no login needed';
  document.getElementById('sheet').innerHTML = `
    <div class="band" style="background:${color}">
      <span class="type">${esc(ch.name)}${idea.content_type ? ' \u00B7 ' + esc(idea.content_type) : ''}</span>
      ${idea.needed_by ? `<span class="needed">needed by ${fmtDate(idea.needed_by)}</span>` : ''}
    </div>
    <div class="body">
      <h1>${esc(idea.title)}</h1>
      ${idea.concept ? `<div class="brief">${esc(idea.concept)}</div>` : ''}
      ${idea.voice_note_url ? `<audio controls src="${esc(idea.voice_note_url)}"></audio>` : ''}
      ${idea.album_url ? `<a class="album" style="background:${color}" href="${esc(idea.album_url)}" target="_blank" rel="noopener">
        Open photo album${idea.photo_count ? ' \u00B7 ' + idea.photo_count + ' photos' : ''} \u2197</a>` : ''}
      <div class="actions">
        <button class="${idea.share_status === 'in_progress' ? 'active' : ''}" onclick="setStatus('in_progress')">Mark in progress</button>
        <button class="${idea.share_status === 'done' ? 'active' : ''}" onclick="setStatus('done')">Done, sent for review</button>
      </div>
    </div>
    <div class="foot">${statusText}</div>`;
}

window.setStatus = async (status) => {
  const { error } = await db.from('social_ideas').update({ share_status: status }).eq('id', idea.id);
  if (!error) { idea.share_status = status; render(); }
};

load();
</script>
</body>
</html>
