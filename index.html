<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f0f13;--bg2:#16161c;--bg3:#1e1e26;--bg4:#26262f;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.16);--text:#f0eff8;--text2:#b8b6cc;--text3:#8a88a0;--accent:#7c6ef5;--accent2:#a99ef9;--accent-bg:rgba(124,110,245,0.12);--urgent:#f97066;--urgent-bg:rgba(249,112,102,0.1);--success:#34d399;--amber:#f59e0b;--amber-bg:rgba(245,158,11,0.1);--col-w:260px;--radius:10px;--radius-sm:8px;--radius-lg:16px;}
.light{--bg:#f4f3fa;--bg2:#ffffff;--bg3:#eeedf6;--bg4:#e4e3f0;--border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.12);--text:#1a1828;--text2:#5a5578;--text3:#7a7890;--accent:#5b4de0;--accent2:#7c6ef5;--accent-bg:rgba(91,77,224,0.08);--urgent:#e03e30;--urgent-bg:rgba(224,62,48,0.08);--success:#059669;--amber:#d97706;--amber-bg:rgba(217,119,6,0.08);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 20px 100px;transition:background 0.3s,color 0.3s;letter-spacing:0.01em;}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:14px;gap:12px;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:38px;height:38px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:700;color:white;letter-spacing:0.5px;}
.logo-name{font-size:18px;font-weight:600;letter-spacing:-0.3px;}
.logo-date{font-size:12px;color:var(--text3);margin-top:2px;}
.topbar-center{display:flex;align-items:center;gap:10px;background:var(--amber-bg);border-left:3px solid var(--amber);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:8px 14px;max-width:420px;}
.sunflower{width:32px;height:32px;border-radius:50%;background:#FEF3C7;border:1.5px solid #F59E0B;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.quote-body{flex:1;min-width:0;}
.quote-text{font-size:12px;font-style:italic;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;line-height:1.5;}
.quote-author{font-size:11px;color:var(--amber);margin-top:3px;font-weight:500;}
.quote-refresh{font-size:14px;color:var(--text3);cursor:pointer;opacity:0.6;transition:opacity 0.15s;flex-shrink:0;}
.quote-refresh:hover{opacity:1;}
.topbar-right{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.chip{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);color:var(--text2);background:var(--bg3);white-space:nowrap;font-weight:500;}
.chip.accent{background:var(--accent-bg);color:var(--accent2);border-color:rgba(124,110,245,0.3);}
.chip.urgent{background:var(--urgent-bg);color:var(--urgent);border-color:rgba(249,112,102,0.3);}
.chip.pastdue{background:rgba(249,112,102,0.1);color:var(--urgent);border-color:rgba(249,112,102,0.25);}
.btn{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;padding:7px 16px;border-radius:20px;border:1px solid var(--border2);color:var(--text2);background:var(--bg3);cursor:pointer;display:flex;align-items:center;gap:6px;transition:background 0.15s;white-space:nowrap;font-weight:500;}
.btn:hover{background:var(--bg4);}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent);}
.btn.primary:hover{opacity:0.88;}
.btn.danger{color:var(--urgent);border-color:rgba(249,112,102,0.3);}
.theme-btn{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background 0.15s;flex-shrink:0;}
.theme-btn:hover{background:var(--bg4);}
.today-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:14px;overflow:hidden;}
.today-header{display:flex;align-items:center;justify-content:space-between;padding:13px 18px 10px;border-bottom:1px solid var(--border);}
.today-title{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.1px;}
.today-cols{display:grid;grid-template-columns:1fr 1fr;height:178px;}
.today-col{display:flex;flex-direction:column;overflow:hidden;}
.today-col:first-child{border-right:1px solid var(--border);background:rgba(29,158,117,0.05);}
.today-col:last-child{background:rgba(124,110,245,0.06);}
.light .today-col:first-child{background:rgba(29,158,117,0.06);}
.light .today-col:last-child{background:rgba(91,77,224,0.06);}
.today-col-header{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.today-col-label{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:0.02em;display:flex;align-items:center;gap:9px;}
.col-label-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.col-label-icon.teal{background:rgba(29,158,117,0.18);color:#1D9E75;}
.col-label-icon.purple{background:rgba(124,110,245,0.15);color:var(--accent2);}
.light .col-label-icon.teal{background:rgba(29,158,117,0.12);}
.light .col-label-icon.purple{background:rgba(91,77,224,0.1);}
.today-col-body{flex:1;overflow-y:auto;padding:0 10px 10px;}
.today-col-body::-webkit-scrollbar{width:3px;}
.today-col-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.int-card{background:transparent;border:1px solid rgba(29,158,117,0.25);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:6px;cursor:pointer;position:relative;transition:border-color 0.15s;}
.int-card:hover{border-color:rgba(29,158,117,0.5);}
.int-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;}
.int-goal-txt{font-size:12px;color:var(--text);line-height:1.3;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.int-track-lbl{font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.int-del{font-size:11px;color:var(--text3);opacity:0;cursor:pointer;transition:opacity 0.15s;flex-shrink:0;margin-left:4px;}
.int-card:hover .int-del{opacity:1;}
.int-add{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text3);cursor:pointer;padding:7px 10px;border:1px dashed rgba(29,158,117,0.3);border-radius:var(--radius-sm);transition:border-color 0.15s,color 0.15s;margin-bottom:6px;}
.int-add:hover{border-color:rgba(29,158,117,0.6);color:var(--success);}
.today-action{display:flex;align-items:center;gap:9px;padding:8px 10px;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;cursor:pointer;transition:border-color 0.15s;}
.today-action:hover{border-color:var(--accent);}
.ta-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:background 0.15s,border-color 0.15s;}
.ta-check.done{background:var(--success);border-color:var(--success);color:white;}
.ta-row{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;}
.ta-title{font-size:12px;font-weight:500;line-height:1.3;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ta-track{font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.today-empty{font-size:12px;color:var(--text3);font-style:italic;padding:12px 10px;}
.board-wrap{overflow-x:auto;padding-bottom:8px;}
.board-wrap::-webkit-scrollbar{height:4px;}
.board-wrap::-webkit-scrollbar-track{background:var(--bg3);border-radius:2px;}
.board-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.board{display:flex;gap:10px;min-width:max-content;}
.col{width:var(--col-w);flex-shrink:0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;transition:border-color 0.15s;}
.col.drag-over{border-color:var(--accent);}
.col-header{padding:14px 14px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--bg2);border-radius:var(--radius-lg) var(--radius-lg) 0 0;cursor:grab;user-select:none;position:relative;}
.col-drag{font-size:14px;color:var(--text3);}
.col-name{font-size:15px;font-weight:400;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.2px;}
.col-rank{font-size:12px;font-weight:700;color:white;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.col-menu-btn{font-size:16px;color:var(--text3);cursor:pointer;padding:2px 3px;border-radius:4px;line-height:1;transition:color 0.15s;}
.col-menu-btn:hover{color:var(--text);}
.col-body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:60px;}
.col-add{margin:0 10px 10px;padding:7px;border-radius:var(--radius-sm);border:1px dashed var(--border2);color:var(--text3);font-size:12px;cursor:pointer;text-align:center;transition:background 0.15s,color 0.15s,border-color 0.15s;}
.col-add:hover{background:var(--bg3);border-color:var(--accent);color:var(--accent2);}
.done-divider{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;padding:2px 0;}
.done-divider::before,.done-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.acard{border-radius:var(--radius-sm);padding:10px 11px;cursor:pointer;transition:border-color 0.15s,transform 0.1s;}
.acard:hover{transform:translateY(-1px);}
.acard.done-card{opacity:0.4;}
.acard.done-card:hover{transform:none;}
.acard-title{font-size:12px;font-weight:500;line-height:1.4;margin-bottom:5px;}
.acard.done-card .acard-title{text-decoration:line-through;color:var(--text3);}
.acard-meta{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);}
.acard-meta.hot{color:var(--urgent);}
.acard-meta.ok{color:var(--success);}
.dropdown{position:absolute;top:calc(100% + 4px);right:0;z-index:200;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);min-width:168px;box-shadow:0 8px 28px rgba(0,0,0,0.35);overflow:hidden;animation:fadeIn 0.1s ease;}
.dd-section{padding:6px 13px 3px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;}
.dd-item{padding:8px 13px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text2);border-bottom:1px solid var(--border);transition:background 0.1s;}
.dd-item:last-child{border-bottom:none;}
.dd-item:hover{background:var(--bg3);color:var(--text);}
.dd-item.danger{color:var(--urgent);}
.dd-item.danger:hover{background:var(--urgent-bg);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn 0.15s ease;backdrop-filter:blur(3px);}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:22px;width:360px;max-width:94vw;max-height:90vh;overflow-y:auto;animation:slideUp 0.18s ease;}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.modal-title{font-size:15px;font-weight:600;line-height:1.3;flex:1;}
.modal-close{font-size:20px;color:var(--text3);cursor:pointer;line-height:1;margin-top:1px;transition:color 0.15s;flex-shrink:0;}
.modal-close:hover{color:var(--text);}
.modal-tag{font-size:11px;padding:2px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;margin-bottom:12px;}
.modal-notes{font-size:13px;color:var(--text2);background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;line-height:1.6;font-weight:300;}
.modal-notes.empty{color:var(--text3);font-style:italic;}
.modal-row{display:flex;gap:10px;margin-bottom:7px;align-items:flex-start;}
.modal-key{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;width:72px;flex-shrink:0;padding-top:2px;}
.modal-val{font-size:12px;color:var(--text2);}
.modal-val.hot{color:var(--urgent);font-weight:500;}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap;}
.modal-field{margin-bottom:12px;}
.modal-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;}
.modal-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 11px;font-size:13px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color 0.15s;}
.modal-input:focus{border-color:var(--accent);}
.modal-textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 11px;font-size:13px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;resize:vertical;min-height:72px;outline:none;transition:border-color 0.15s;}
.modal-textarea:focus{border-color:var(--accent);}
.modal-select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 11px;font-size:13px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;outline:none;appearance:none;cursor:pointer;}
.modal-select:focus{border-color:var(--accent);}
input[type="date"].modal-input{color-scheme:light dark;}
.light input[type="date"].modal-input{color-scheme:light;}
.recap-tab{flex:1;padding:5px 10px;border-radius:16px;font-size:12px;cursor:pointer;text-align:center;transition:background 0.15s,color 0.15s;color:var(--text3);}
.recap-tab.active{background:var(--accent);color:white;}
.recap-track-block{margin-bottom:14px;}
.recap-track-name{font-size:13px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:7px;}
.recap-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.recap-intention{font-size:12px;color:var(--text2);font-style:italic;background:var(--bg3);border-radius:var(--radius-sm);padding:6px 10px;margin-bottom:4px;border-left:2px solid var(--amber);}
.recap-action{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--text2);margin-bottom:4px;background:var(--bg3);border-radius:var(--radius-sm);padding:5px 8px;}
.recap-check{color:var(--success);flex-shrink:0;}
.recap-manual{font-size:12px;color:var(--text2);background:var(--bg3);border-radius:var(--radius-sm);padding:6px 10px;margin-bottom:4px;border-left:2px solid var(--accent);}
.recap-manual-meta{font-size:10px;color:var(--text3);margin-top:2px;}
.recap-empty{font-size:12px;color:var(--text3);font-style:italic;padding:10px 0;}
.add-to-recap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);cursor:pointer;padding:7px 10px;border:1px dashed var(--border2);border-radius:var(--radius-sm);margin-top:10px;transition:border-color 0.15s,color 0.15s;}
.add-to-recap:hover{border-color:var(--accent);color:var(--accent2);}
.recap-widget{position:fixed;bottom:20px;right:20px;z-index:500;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.recap-panel{width:340px;max-height:520px;background:var(--bg2);border:1px solid var(--border2);border-radius:16px;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.4);overflow:hidden;transform-origin:bottom right;animation:expandUp 0.22s cubic-bezier(0.34,1.56,0.64,1);}
.recap-panel-header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--bg3);flex-shrink:0;}
.recap-panel-title{font-size:14px;font-weight:600;}
.recap-panel-close{font-size:18px;color:var(--text3);cursor:pointer;line-height:1;transition:color 0.15s;}
.recap-panel-close:hover{color:var(--text);}
.recap-panel-body{flex:1;overflow-y:auto;padding:14px 16px;}
.recap-panel-body::-webkit-scrollbar{width:3px;}
.recap-panel-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.recap-btn{background:var(--accent);border:none;border-radius:24px;padding:10px 18px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:500;color:white;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(124,110,245,0.4);transition:opacity 0.15s;}
.recap-btn:hover{opacity:0.88;}
.loading{display:flex;align-items:center;justify-content:center;height:100px;color:var(--text3);font-size:13px;gap:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes expandUp{from{opacity:0;transform:scale(0.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <div class="logo-icon">LP</div>
      <div style="position:relative;">
        <div class="logo-name" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--border2,#e2ded6);border-radius:999px;background:var(--bg2,#fff);" onclick="var m=document.getElementById('ws-menu');m.style.display=m.style.display==='block'?'none':'block';event.stopPropagation();">Command Center <span style="font-size:13px;color:#7A4FBF;">&#9662;</span></div>
        <div id="ws-menu" style="display:none;position:absolute;top:calc(100% + 6px);left:0;background:var(--bg2,#fff);border:1px solid var(--border2,#e2ded6);border-radius:12px;padding:6px;z-index:200;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,0.1);">
          <div style="font-size:13px;font-weight:600;padding:9px 12px;border-radius:8px;background:var(--bg3,#f4f1ea);">Command Center</div>
          <a href="social.html" style="display:block;font-size:13px;padding:9px 12px;border-radius:8px;color:inherit;text-decoration:none;">Social HQ</a>
        </div>
        <script>document.addEventListener('click',function(){var m=document.getElementById('ws-menu');if(m)m.style.display='none';});</script>
        <div class="logo-date" id="today-date"></div>
      </div>
    </div>
  </div>
  <div class="topbar-center">
    <div class="sunflower">🌻</div>
    <div class="quote-body">
      <div class="quote-text" id="quote-text"></div>
      <div class="quote-author" id="quote-author"></div>
    </div>
    <div class="quote-refresh" onclick="loadQuote()" title="New quote">↻</div>
  </div>
  <div class="topbar-right">
    <span class="chip accent" id="chip-tracks">— tracks</span>
    <span class="chip urgent" id="chip-today">— due today</span>
    <span class="chip pastdue" id="chip-pastdue" style="display:none"></span>
    <button class="btn primary" onclick="openAddTrack()">+ add track</button>
    <div class="theme-btn" onclick="toggleTheme()" id="theme-btn">🌙</div>
  </div>
</div>

<div class="today-section">
  <div class="today-header">
    <span class="today-title">🎯 What will I accomplish today</span>
    <span style="font-size:11px;color:var(--text3);cursor:pointer" onclick="openEditIntentions()">edit all</span>
  </div>
  <div class="today-cols">
    <div class="today-col">
      <div class="today-col-header">
        <span class="today-col-label"><span class="col-label-icon teal">🎯</span>INTENTIONS</span>
        <span style="font-size:11px;color:var(--text3);cursor:pointer" onclick="openPickIntention()">+ add</span>
      </div>
      <div class="today-col-body" id="intentions-body"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <div class="today-col">
      <div class="today-col-header">
        <span class="today-col-label"><span class="col-label-icon purple">✓</span>DUE TODAY</span>
      </div>
      <div class="today-col-body" id="today-actions-body"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>

<div class="board-wrap">
  <div class="board" id="board"><div class="loading"><div class="spinner"></div> Loading tracks...</div></div>
</div>

<div class="recap-widget" id="recap-widget">
  <div class="recap-panel" id="recap-panel" style="display:none"></div>
  <button class="recap-btn" onclick="toggleRecap()">📓 Recap</button>
</div>

<div id="modal-container"></div>

<script>
const SUPABASE_URL='https://neqxgfngmsysojsppjob.supabase.co';
const SUPABASE_KEY='sb_publishable_PfLkC0-ndwysvhQSIiLvdQ_9v8zrOYy';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const QUOTES=[
  {text:"The secret of getting ahead is getting started.",author:"Mark Twain"},
  {text:"Done is better than perfect.",author:"Sheryl Sandberg"},
  {text:"Focus on being productive instead of busy.",author:"Tim Ferriss"},
  {text:"Small daily improvements over time lead to stunning results.",author:"Robin Sharma"},
  {text:"The future depends on what you do today.",author:"Mahatma Gandhi"},
  {text:"It always seems impossible until it's done.",author:"Nelson Mandela"},
  {text:"Energy flows where intention goes.",author:"Rhonda Byrne"},
  {text:"Ship it. Then make it better.",author:"Unknown"},
  {text:"Build the life you can't stop thinking about.",author:"Unknown"},
  {text:"Clarity comes from action, not thought.",author:"Marie Forleo"},
  {text:"A year from now you'll wish you had started today.",author:"Karen Lamb"},
  {text:"Believe you can and you're halfway there.",author:"Theodore Roosevelt"},
  {text:"Work hard in silence. Let success be your noise.",author:"Frank Ocean"},
  {text:"You don't have to be great to start, but you have to start to be great.",author:"Zig Ziglar"},
  {text:"Every expert was once a beginner.",author:"Helen Hayes"}
];
const TC=['#7c6ef5','#34d399','#f59e0b','#f97066','#60a5fa','#a78bfa','#fb7185'];

let isDark=localStorage.getItem('theme')==='dark',openMenuId=null,recapOpen=false,recapViewMode='yesterday';
let tracks=[],actions=[],intentions=[],recapLogs=[];

function dk(d){return d.toISOString().split('T')[0];}
function todayKey(){return dk(new Date());}
function yesterdayKey(){const d=new Date();d.setDate(d.getDate()-1);return dk(d);}
function lastWeekRange(){
  const today=new Date(),day=today.getDay(),sinceMon=((day+6)%7);
  const lastMon=new Date(today);lastMon.setDate(today.getDate()-sinceMon-7);lastMon.setHours(0,0,0,0);
  const lastSat=new Date(lastMon);lastSat.setDate(lastMon.getDate()+5);
  return{from:dk(lastMon),to:dk(lastSat)};
}
function tc(i){return TC[i%TC.length];}
function tIdx(id){return tracks.findIndex(t=>t.id===id);}

async function dbTracks(){const{data}=await sb.from('cc_tracks').select('*').order('rank');return data||[];}
async function dbActions(){const{data}=await sb.from('cc_actions').select('*').order('created_at');return data||[];}
async function dbIntentions(){const{data}=await sb.from('cc_intentions').select('*');return data||[];}
async function dbRecapLogs(){const{data}=await sb.from('cc_recap_logs').select('*').order('created_at');return data||[];}

async function upsertTrack(t){await sb.from('cc_tracks').upsert({id:t.id,name:t.name,description:t.description||'',why:t.why||'',focus:t.focus||'',rank:t.rank,status:t.status,updated_at:new Date().toISOString()});}
async function upsertAction(a){await sb.from('cc_actions').upsert({id:a.id,track_id:a.trackId,title:a.title,notes:a.notes||'',link:a.link||'',due:a.due||'',done:a.done,added_from:a.addedFrom||'dashboard',updated_at:new Date().toISOString()});}
async function deleteAction(id){await sb.from('cc_actions').delete().eq('id',id);}
async function deleteTrack(id){await sb.from('cc_tracks').delete().eq('id',id);}
async function upsertIntention(i){await sb.from('cc_intentions').upsert({id:i.id,date:i.date,track_id:i.trackId,goal:i.goal});}
async function deleteIntention(id){await sb.from('cc_intentions').delete().eq('id',id);}
async function insertRecapLog(l){await sb.from('cc_recap_logs').insert({id:l.id,text:l.text,track_id:l.trackId||'',type:l.type,date:l.date,source:l.source||'dashboard'});}

function mapTrack(r){return{id:r.id,name:r.name,description:r.description,why:r.why,focus:r.focus,rank:r.rank,status:r.status};}
function mapAction(r){return{id:r.id,trackId:r.track_id,title:r.title,notes:r.notes,link:r.link,due:r.due,done:r.done,addedFrom:r.added_from};}
function mapIntention(r){return{id:r.id,date:r.date,trackId:r.track_id,goal:r.goal};}
function mapRecapLog(r){return{id:r.id,text:r.text,trackId:r.track_id,type:r.type,date:r.date,source:r.source};}

async function init(){
  applyThemeOnLoad();
  document.getElementById('today-date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  loadQuote();
  const[t,a,i,r]=await Promise.all([dbTracks(),dbActions(),dbIntentions(),dbRecapLogs()]);
  tracks=t.map(mapTrack);
  actions=a.map(mapAction);
  intentions=i.map(mapIntention);
  recapLogs=r.map(mapRecapLog);
  render();
}

function loadQuote(){
  const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('quote-text').textContent=`"${q.text}"`;
  document.getElementById('quote-author').textContent=`— ${q.author}`;
}
function toggleTheme(){isDark=!isDark;localStorage.setItem('theme',isDark?'dark':'light');document.body.classList.toggle('light',!isDark);document.getElementById('theme-btn').textContent=isDark?'🌙':'☀️';}
function applyThemeOnLoad(){document.body.classList.toggle('light',!isDark);document.getElementById('theme-btn').textContent=isDark?'🌙':'☀️';}

function isToday(a){
  if(a.done||!a.due)return false;
  if(a.due==='today')return true;
  try{const d=new Date(a.due);if(!isNaN(d.getTime()))return dk(d)===todayKey();}catch{}return false;
}
function isPast(a){
  if(a.done||!a.due||['today','this week','this month',''].includes(a.due))return false;
  try{const d=new Date(a.due);if(!isNaN(d.getTime())){const t=new Date();t.setHours(0,0,0,0);return d<t;}}catch{}return false;
}
function fmtDue(due){
  if(!due)return'no deadline';
  if(due.match(/^\d{4}-\d{2}-\d{2}$/))return new Date(due+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return due;
}

function render(){
  const todayCnt=actions.filter(a=>isToday(a)).length;
  const pastCnt=actions.filter(a=>isPast(a)).length;
  document.getElementById('chip-tracks').textContent=`${tracks.length} tracks`;
  document.getElementById('chip-today').textContent=`${todayCnt} due today`;
  const pc=document.getElementById('chip-pastdue');
  if(pastCnt>0){pc.style.display='';pc.textContent=`⚠ ${pastCnt} past due`;}else{pc.style.display='none';}
  renderIntentions();renderTodayActions();renderBoard();
}

function getTodayIntentions(){return intentions.filter(i=>i.date===todayKey());}

function renderIntentions(){
  const body=document.getElementById('intentions-body');
  const ti=getTodayIntentions();
  let h='';
  ti.forEach(i=>{
    const isGen=!i.trackId||i.trackId==='__general__';
    const t=isGen?null:tracks.find(x=>x.id===i.trackId);
    const c=isGen?'var(--text3)':tc(tIdx(i.trackId));
    const label=isGen?'General':t?t.name:'';
    h+=`<div class="int-card">
      <div class="int-row">
        <div class="int-goal-txt">${i.goal}</div>
        <span class="int-track-lbl" style="color:${c}">${label}</span>
        <span class="int-del" onclick="event.stopPropagation();removeIntention('${i.id}')">✕</span>
      </div>
    </div>`;
  });
  h+=`<div class="int-add" onclick="openPickIntention()"><span>+</span> set intention</div>`;
  body.innerHTML=h;
}

function renderTodayActions(){
  const body=document.getElementById('today-actions-body');
  const due=actions.filter(a=>isToday(a));
  if(!due.length){body.innerHTML=`<div class="today-empty">Nothing due today 🎉</div>`;return;}
  body.innerHTML=due.map(a=>{
    const t=tracks.find(x=>x.id===a.trackId);
    const c=tc(tIdx(a.trackId));
    return`<div class="today-action" onclick="openCard('${a.id}')">
      <div class="ta-check ${a.done?'done':''}"></div>
      <div class="ta-row">
        <div class="ta-title" style="${a.done?'text-decoration:line-through;color:var(--text3)':''}">${a.title}</div>
        ${t?`<div class="ta-track" style="color:${c}">${t.name}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderBoard(){
  const board=document.getElementById('board');
  const sorted=[...tracks].sort((a,b)=>(a.rank||99)-(b.rank||99));
  if(!sorted.length){board.innerHTML='<div class="loading">No tracks yet — add one above</div>';return;}
  board.innerHTML=sorted.map(t=>{
    const i=tIdx(t.id),c=tc(i);
    const ta=actions.filter(a=>a.trackId===t.id);
    const active=ta.filter(a=>!a.done),done=ta.filter(a=>a.done);
    const cards=[...active.map(a=>cardHtml(a,c)),...(done.length?[`<div class="done-divider">done</div>`,...done.map(a=>cardHtml(a,c))]:[''])].join('');
    return`<div class="col" id="col-${t.id}" draggable="true" ondragstart="ds(event,'${t.id}')" ondragover="dov(event)" ondrop="drop(event,'${t.id}')" ondragleave="dl(event)">
      <div class="col-header">
        <span class="col-drag">⠿</span>
        <span class="col-name">${t.name}</span>
        <span class="col-menu-btn" onclick="toggleMenu(event,'${t.id}')">···</span>
        <span class="col-rank" style="background:${c}">${t.rank||i+1}</span>
        <div class="dropdown" id="menu-${t.id}" style="display:none">
          <div class="dd-section">Track</div>
          <div class="dd-item" onclick="closeMenus();openTrackInfo('${t.id}')">📋 View details</div>
          <div class="dd-item" onclick="closeMenus();openEditTrack('${t.id}')">✏️ Edit track</div>
          <div class="dd-item" onclick="closeMenus();openChangeRank('${t.id}')">↕️ Change rank</div>
          <div class="dd-item danger" onclick="closeMenus();archiveTrack('${t.id}')">📦 Archive</div>
        </div>
      </div>
      <div class="col-body">${cards}</div>
      <div class="col-add" onclick="openAddAction('${t.id}')">+ add item</div>
    </div>`;
  }).join('');
}

function cardHtml(a,trackColor){
  const hot=isToday(a)&&!a.done,past=isPast(a);
  const mc=a.done?'ok':hot||past?'hot':'';
  const mi=a.done?'✓':hot||past?'⚠':'◷';
  const bg=trackColor?`${trackColor}12`:'var(--bg3)';
  const bdr=trackColor?`1px solid ${trackColor}28`:`1px solid var(--border)`;
  return`<div class="acard ${a.done?'done-card':''}" style="background:${bg};border:${bdr}" onclick="openCard('${a.id}')"><div class="acard-title">${a.title}</div><div class="acard-meta ${mc}">${mi} ${a.done?'done':fmtDue(a.due)}</div></div>`;
}

let dragId=null;
function ds(e,id){dragId=id;e.dataTransfer.effectAllowed='move';}
function dov(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dl(e){e.currentTarget.classList.remove('drag-over');}
async function drop(e,tid){
  e.currentTarget.classList.remove('drag-over');
  if(!dragId||dragId===tid)return;
  const fi=tracks.findIndex(t=>t.id===dragId),ti2=tracks.findIndex(t=>t.id===tid);
  const m=tracks.splice(fi,1)[0];tracks.splice(ti2,0,m);
  tracks.forEach((t,idx)=>{t.rank=idx+1;});
  render();
  await Promise.all(tracks.map(t=>upsertTrack(t)));
  dragId=null;
}

function toggleMenu(e,id){
  e.stopPropagation();
  const m=document.getElementById(`menu-${id}`);
  const vis=m.style.display!=='none';
  closeMenus();
  if(!vis){m.style.display='block';openMenuId=id;}
}
function closeMenus(){if(openMenuId){const m=document.getElementById(`menu-${openMenuId}`);if(m)m.style.display='none';openMenuId=null;}}
document.addEventListener('click',closeMenus);
function showModal(h){document.getElementById('modal-container').innerHTML=h;}
function closeModal(){document.getElementById('modal-container').innerHTML='';}

function openCard(id){
  const a=actions.find(x=>x.id===id);if(!a)return;
  const t=tracks.find(x=>x.id===a.trackId);
  const c=tc(tIdx(a.trackId));
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">${a.title}</div><div class="modal-close" onclick="closeModal()">×</div></div>
      <div class="modal-tag" style="background:${c}18;color:${c};border:1px solid ${c}40"><div style="width:5px;height:5px;border-radius:50%;background:${c}"></div>${t?t.name:''}</div>
      <div class="modal-notes ${a.notes?'':'empty'}">${a.notes||'No notes added yet.'}</div>
      <div class="modal-row"><span class="modal-key">Due</span><span class="modal-val ${isToday(a)||isPast(a)?'hot':''}">${fmtDue(a.due)||'No deadline'}</span></div>
      ${a.link?`<div class="modal-row"><span class="modal-key">Link</span><span class="modal-val"><a href="${a.link}" target="_blank" style="color:var(--accent2);text-decoration:none">${a.link.length>44?a.link.slice(0,44)+'...':a.link} ↗</a></span></div>`:''}
      <div class="modal-row"><span class="modal-key">Status</span><span class="modal-val">${a.done?'✓ Done':'In progress'}</span></div>
      ${a.addedFrom?`<div class="modal-row"><span class="modal-key">Added from</span><span class="modal-val">${a.addedFrom}</span></div>`:''}
      <div class="modal-actions">
        <button class="btn danger" onclick="delAction('${id}')">Delete</button>
        <button class="btn" onclick="openEditAction('${id}')">Edit</button>
        <button class="btn primary" onclick="toggleDone('${id}')">${a.done?'↩ Reopen':'✓ Mark done'}</button>
      </div>
    </div>
  </div>`);
}

function openAddAction(tid){
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Add action item</div><div class="modal-close" onclick="closeModal()">×</div></div>
      <div class="modal-field"><div class="modal-label">Title</div><input class="modal-input" id="na-t" placeholder="What needs to be done?" autofocus></div>
      <div class="modal-field"><div class="modal-label">Notes (optional)</div><textarea class="modal-textarea" id="na-n" placeholder="Context, details..."></textarea></div>
      <div class="modal-field"><div class="modal-label">Link (optional)</div><input class="modal-input" id="na-l" placeholder="https://..."></div>
      <div class="modal-field"><div class="modal-label">Due</div>
        <select class="modal-select" id="na-d" onchange="toggleDP('na')">
          <option value="">No deadline</option>
          <option value="today">Today</option>
          <option value="this week">This week</option>
          <option value="this month">This month</option>
          <option value="custom">Pick a date...</option>
        </select>
        <input type="date" class="modal-input" id="na-dp" style="display:none;margin-top:6px">
      </div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAdd('${tid}')">Add item</button></div>
    </div>
  </div>`);
  setTimeout(()=>document.getElementById('na-t')?.focus(),50);
}

function toggleDP(p){const s=document.getElementById(`${p}-d`),dp=document.getElementById(`${p}-dp`);if(dp)dp.style.display=s.value==='custom'?'block':'none';}
function getDue(p){const s=document.getElementById(`${p}-d`).value;return s==='custom'?(document.getElementById(`${p}-dp`).value||''):s;}

async function saveAdd(tid){
  const title=document.getElementById('na-t').value.trim();if(!title)return;
  const a={id:'a'+Date.now(),trackId:tid,title,notes:document.getElementById('na-n').value.trim(),link:document.getElementById('na-l').value.trim(),due:getDue('na'),done:false,addedFrom:'dashboard'};
  actions.push(a);await upsertAction(a);closeModal();render();
}

function openEditAction(id){
  const a=actions.find(x=>x.id===id);if(!a)return;
  const isCustom=a.due&&!['','today','this week','this month'].includes(a.due);
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Edit item</div><div class="modal-close" onclick="closeModal()">×</div></div>
      <div class="modal-field"><div class="modal-label">Title</div><input class="modal-input" id="ea-t" value="${a.title}"></div>
      <div class="modal-field"><div class="modal-label">Notes</div><textarea class="modal-textarea" id="ea-n">${a.notes||''}</textarea></div>
      <div class="modal-field"><div class="modal-label">Link</div><input class="modal-input" id="ea-l" value="${a.link||''}" placeholder="https://..."></div>
      <div class="modal-field"><div class="modal-label">Due</div>
        <select class="modal-select" id="ea-d" onchange="toggleDP('ea')">
          <option value="" ${!a.due?'selected':''}>No deadline</option>
          <option value="today" ${a.due==='today'?'selected':''}>Today</option>
          <option value="this week" ${a.due==='this week'?'selected':''}>This week</option>
          <option value="this month" ${a.due==='this month'?'selected':''}>This month</option>
          <option value="custom" ${isCustom?'selected':''}>Pick a date...</option>
        </select>
        <input type="date" class="modal-input" id="ea-dp" value="${isCustom?a.due:''}" style="display:${isCustom?'block':'none'};margin-top:6px">
      </div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEdit('${id}')">Save</button></div>
    </div>
  </div>`);
}

async function saveEdit(id){
  const a=actions.find(x=>x.id===id);if(!a)return;
  a.title=document.getElementById('ea-t').value.trim()||a.title;
  a.notes=document.getElementById('ea-n').value.trim();
  a.link=document.getElementById('ea-l').value.trim();
  a.due=getDue('ea');
  await upsertAction(a);closeModal();render();
}

async function toggleDone(id){
  const a=actions.find(x=>x.id===id);
  if(a){
    a.done=!a.done;
    if(a.done){const l={id:'l'+Date.now(),text:a.title,trackId:a.trackId,type:'action',date:todayKey(),source:'dashboard'};recapLogs.push(l);await insertRecapLog(l);}
    await upsertAction(a);
  }
  closeModal();render();
}

async function delAction(id){
  actions=actions.filter(x=>x.id!==id);
  await deleteAction(id);closeModal();render();
}

function openTrackInfo(id){
  const t=tracks.find(x=>x.id===id);if(!t)return;
  const c=tc(tIdx(id));
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><div class="modal-title" style="color:${c}">${t.name}</div><div class="modal-close" onclick="closeModal()">×</div></div>
      <div class="modal-row"><span class="modal-key">Rank</span><span class="modal-val">${t.rank}</span></div>
      <div class="modal-row"><span class="modal-key">Status</span><span class="modal-val">${t.status}</span></div>
      <div class="modal-row"><span class="modal-key">Description</span><span class="modal-val">${t.description||'—'}</span></div>
      <div class="modal-row"><span class="modal-key">Why</span><span class="modal-val">${t.why||'—'}</span></div>
      <div class="modal-row"><span class="modal-key">Focus</span><span class="modal-val">${t.focus||'—'}</span></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();openEditTrack('${id}')">Edit</button></div>
    </div>
  </div>`);
}

function openEditTrack(id){
  const t=tracks.find(x=>x.id===id);if(!t)return;
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Edit track</div><div class="modal-close" onclick="closeModal()">×</div></div>
      <div class="modal-field"><div class="modal-label">Name</div><input class="modal-input" id="et-n" value="${t.name}"></div>
      <div class="modal-field"><div class="modal-label">Description</div><input class="modal-input" id="et-d" value="${t.description||''}" placeholder="One line on what this is"></div>
      <div class="modal-field"><div class="modal-label">Why it matters</div><textarea class="modal-textarea" id="et-w" style="min-height:56px">${t.why||''}</textarea></div>
      <div class="modal-field"><div class="modal-label">Current focus</div><input class="modal-input" id="et-f" value="${t.focus||''}" placeholder="What's the focus right now?"></div>
      <div class="modal-field"><div class="modal-label">Rank</div><input class="modal-input" id="et-r" type="number" min="1" max="20" value="${t.rank||''}"></div>
      <div class="modal-field"><div class="modal-label">Status</div>
        <select class="modal-select" id="et-s">
          <option value="active" ${t.status==='active'?'selected':''}>Active</option>
          <option value="building" ${t.status==='building'?'selected':''}>Building</option>
          <option value="discovery" ${t.status==='discovery'?'selected':''}>Discovery</option>
          <option value="paused" ${t.status==='paused'?'selected':''}>Paused</option>
        </select>
      </div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveETrack('${id}')">Save</button></div>
    </div>
  </div>`);
}

async function saveETrack(id){
  const t=tracks.find(x=>x.id===id);if(!t)return;
  const newRank=parseInt(document.getElementById('et-r').value)||t.rank;
  const conflict=tracks.find(x=>x.id!==id&&x.rank===newRank);
  if(conflict&&newRank!==t.rank){
    if(!confirm(`"${conflict.name}" is already ranked ${newRank}.\nSwap ranks? "${t.name}" → ${newRank}, "${conflict.name}" → ${t.rank}`))return;
    conflict.rank=t.rank;await upsertTrack(conflict);
  }
  t.name=document.getElementById('et-n').value.trim()||t.name;
  t.description=document.getElementById('et-d').value.trim();
  t.why=document.getElementById('et-w').value.trim();
  t.focus=document.getElementById('et-f').value.trim();
  t.rank=newRank;
  t.status=document.getElementById('et-s').value;
  await upsertTrack(t);closeModal();render();
}

function openChangeRank(id){
  const t=tracks.find(x=>x.id===id);
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Change rank — ${t.name}</div><div class="modal-close" onclick="closeModal()">×</div></div>
      <div class="modal-field"><div class="modal-label">Rank (1 = top priority)</div><input class="modal-input" id="cr-r" type="number" min="1" max="20" value="${t.rank||1}" autofocus></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRank('${id}')">Save</button></div>
    </div>
  </div>`);
}

async function saveRank(id){
  const t=tracks.find(x=>x.id===id);if(!t)return;
  const newRank=parseInt(document.getElementById('cr-r').value)||t.rank;
  const conflict=tracks.find(x=>x.id!==id&&x.rank===newRank);
  if(conflict){
    if(!confirm(`"${conflict.name}" is already ranked ${newRank}.\nSwap? "${t.name}" → ${newRank}, "${conflict.name}" → ${t.rank}`))return;
    conflict.rank=t.rank;await upsertTrack(conflict);
  }
  t.rank=newRank;await upsertTrack(t);closeModal();render();
}

async function archiveTrack(id){
  if(!confirm('Archive this track?'))return;
  tracks=tracks.filter(x=>x.id!==id);
  await deleteTrack(id);render();
}

function openAddTrack(){
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Add new track</div><div class="modal-close" onclick="closeModal()">×</div></div>
      <div class="modal-field"><div class="modal-label">Name</div><input class="modal-input" id="nt-n" placeholder="Track name" autofocus></div>
      <div class="modal-field"><div class="modal-label">Description</div><input class="modal-input" id="nt-d" placeholder="One line on what this is"></div>
      <div class="modal-field"><div class="modal-label">Why it matters</div><textarea class="modal-textarea" id="nt-w" style="min-height:56px" placeholder="Why are you working on this?"></textarea></div>
      <div class="modal-field"><div class="modal-label">Rank</div><input class="modal-input" id="nt-r" type="number" min="1" max="20" placeholder="${tracks.length+1}"></div>
      <div class="modal-field"><div class="modal-label">Status</div>
        <select class="modal-select" id="nt-s">
          <option value="active">Active</option><option value="building">Building</option><option value="discovery">Discovery</option><option value="paused">Paused</option>
        </select>
      </div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNewTrack()">Add track</button></div>
    </div>
  </div>`);
  setTimeout(()=>document.getElementById('nt-n')?.focus(),50);
}

async function saveNewTrack(){
  const name=document.getElementById('nt-n').value.trim();if(!name)return;
  const t={id:'t'+Date.now(),name,description:document.getElementById('nt-d').value.trim(),why:document.getElementById('nt-w').value.trim(),focus:'',rank:parseInt(document.getElementById('nt-r').value)||tracks.length+1,status:document.getElementById('nt-s').value};
  tracks.push(t);await upsertTrack(t);closeModal();render();
}

function openPickIntention(){
  const today=todayKey();
  const existing=getTodayIntentions();
  const existingTrackIds=existing.map(i=>i.trackId);
  const hasGeneral=existing.some(i=>!i.trackId||i.trackId==='__general__');
  const avail=tracks.filter(t=>!existingTrackIds.includes(t.id));
  const generalOpt=hasGeneral?'':`<div onclick="closeModal();promptIntention('__general__')" style="display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.1s" onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background=''">
    <div style="width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0"></div><span style="font-size:13px;color:var(--text2)">General (no track)</span>
  </div>`;
  const opts=avail.map(t=>{
    const c=tc(tIdx(t.id));
    return`<div onclick="closeModal();promptIntention('${t.id}')" style="display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.1s" onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background=''">
      <div style="width:8px;height:8px;border-radius:50%;background:${c};flex-shrink:0"></div><span style="font-size:13px">${t.name}</span>
    </div>`;
  }).join('');
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="padding:0;overflow:hidden">
      <div style="padding:15px 16px 11px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
        <div class="modal-title" style="padding:0">Set intention for...</div><div class="modal-close" onclick="closeModal()">×</div>
      </div>${generalOpt}${opts}
    </div>
  </div>`);
}

function promptIntention(tid){
  const isGeneral=tid==='__general__';
  const t=isGeneral?null:tracks.find(x=>x.id===tid);
  const label=isGeneral?'General':'Intention — '+(t?.name||'');
  const existing=getTodayIntentions().find(i=>isGeneral?(!i.trackId||i.trackId==='__general__'):i.trackId===tid);
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">${label}</div><div class="modal-close" onclick="closeModal()">×</div></div>
      <div class="modal-field"><input class="modal-input" id="int-g" value="${existing?existing.goal:''}" placeholder="${isGeneral?'e.g. Deep work day, rest and reflect...':'What do you want to accomplish today?'}" autofocus></div>
      <div class="modal-actions">
        ${existing?`<button class="btn danger" onclick="removeIntention('${existing.id}')">Clear</button>`:''}
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="saveIntention('${tid}','${existing?existing.id:''}')">Save</button>
      </div>
    </div>
  </div>`);
  setTimeout(()=>document.getElementById('int-g')?.focus(),50);
}

async function saveIntention(tid,existingId){
  const v=document.getElementById('int-g').value.trim();
  const today=todayKey();
  if(existingId){await deleteIntention(existingId);intentions=intentions.filter(i=>i.id!==existingId);}
  if(v){
    const isGeneral=tid==='__general__';
    const i={id:'i'+Date.now(),date:today,trackId:isGeneral?'':tid,goal:v};
    intentions.push(i);await upsertIntention(i);
    const alreadyLogged=recapLogs.find(l=>l.type==='intention'&&l.trackId===i.trackId&&l.date===today);
    if(!alreadyLogged){const l={id:'l'+Date.now(),text:v,trackId:i.trackId,type:'intention',date:today,source:'dashboard'};recapLogs.push(l);await insertRecapLog(l);}
  }
  closeModal();renderIntentions();
}

async function removeIntention(id){
  intentions=intentions.filter(i=>i.id!==id);
  await deleteIntention(id);closeModal();renderIntentions();
}

function openEditIntentions(){
  const ti=getTodayIntentions();
  const fields=tracks.map(t=>{
    const existing=ti.find(i=>i.trackId===t.id);
    return`<div class="modal-field"><div class="modal-label" style="display:flex;align-items:center;gap:5px"><div style="width:5px;height:5px;border-radius:50%;background:${tc(tIdx(t.id))}"></div>${t.name}</div><input class="modal-input" id="ie-${t.id}" value="${existing?existing.goal:''}" placeholder="Today's intention..."></div>`;
  }).join('');
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-height:80vh;overflow-y:auto">
      <div class="modal-header"><div class="modal-title">Edit intentions</div><div class="modal-close" onclick="closeModal()">×</div></div>
      ${fields}
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAllInt()">Save all</button></div>
    </div>
  </div>`);
}

async function saveAllInt(){
  const today=todayKey();
  const existing=getTodayIntentions();
  for(const t of tracks){
    const el=document.getElementById(`ie-${t.id}`);if(!el)continue;
    const v=el.value.trim();
    const ex=existing.find(i=>i.trackId===t.id);
    if(ex){await deleteIntention(ex.id);intentions=intentions.filter(i=>i.id!==ex.id);}
    if(v){const i={id:'i'+Date.now(),date:today,trackId:t.id,goal:v};intentions.push(i);await upsertIntention(i);}
  }
  closeModal();renderIntentions();
}

function toggleRecap(){
  recapOpen=!recapOpen;
  const panel=document.getElementById('recap-panel');
  if(recapOpen){panel.style.display='flex';panel.style.flexDirection='column';renderRecapPanel();}
  else{panel.style.display='none';}
}

function openRecap(){recapOpen=true;const p=document.getElementById('recap-panel');p.style.display='flex';p.style.flexDirection='column';renderRecapPanel();}

function renderRecapPanel(){
  const panel=document.getElementById('recap-panel');if(!panel)return;
  const isY=recapViewMode==='yesterday';
  const target=isY?yesterdayKey():null;
  const wr=lastWeekRange();
  const logs=recapLogs.filter(l=>isY?l.date===target:l.date>=wr.from&&l.date<=wr.to);
  const byTrack={};
  logs.forEach(l=>{const key=l.trackId||'__general__';if(!byTrack[key])byTrack[key]={i:[],a:[],m:[]};if(l.type==='intention')byTrack[key].i.push(l);else if(l.type==='action')byTrack[key].a.push(l);else byTrack[key].m.push(l);});
  let blocksHtml='';
  if(Object.keys(byTrack).length){
    tracks.forEach(t=>{
      const d=byTrack[t.id];if(!d)return;
      const c=tc(tIdx(t.id));
      let inner=d.i.map(l=>`<div class="recap-intention">💭 ${l.text}</div>`).join('');
      inner+=d.a.map(l=>`<div class="recap-action"><span class="recap-check">✓</span>${l.text}</div>`).join('');
      inner+=d.m.map(l=>`<div class="recap-manual">📝 ${l.text}<div class="recap-manual-meta">${l.source||'chat'} · ${l.date}</div></div>`).join('');
      if(inner)blocksHtml+=`<div class="recap-track-block"><div class="recap-track-name"><div class="recap-dot" style="background:${c}"></div>${t.name}</div>${inner}</div>`;
    });
    const gen=byTrack['__general__'];
    if(gen){let inner=gen.i.map(l=>`<div class="recap-intention">💭 ${l.text}</div>`).join('');inner+=gen.a.map(l=>`<div class="recap-action"><span class="recap-check">✓</span>${l.text}</div>`).join('');inner+=gen.m.map(l=>`<div class="recap-manual">📝 ${l.text}<div class="recap-manual-meta">${l.source||'chat'} · ${l.date}</div></div>`).join('');if(inner)blocksHtml+=`<div class="recap-track-block"><div class="recap-track-name"><div class="recap-dot" style="background:var(--text3)"></div>General</div>${inner}</div>`;}
  }else{
    const wLabel=`${new Date(wr.from+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${new Date(wr.to+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
    blocksHtml=`<div class="recap-empty">Nothing logged ${isY?'yesterday':`last week (${wLabel})`} yet.</div>`;
  }
  panel.innerHTML=`
    <div class="recap-panel-header"><div class="recap-panel-title">📓 Recap</div><span class="recap-panel-close" onclick="toggleRecap()">×</span></div>
    <div class="recap-panel-body">
      <div class="recap-toggle" style="display:flex;background:var(--bg3);border-radius:20px;padding:3px;gap:3px;margin-bottom:14px">
        <div class="recap-tab ${recapViewMode==='yesterday'?'active':''}" onclick="recapViewMode='yesterday';renderRecapPanel()">Yesterday</div>
        <div class="recap-tab ${recapViewMode==='week'?'active':''}" onclick="recapViewMode='week';renderRecapPanel()">Last week</div>
      </div>
      ${blocksHtml}
      <div class="add-to-recap" onclick="openAddToRecap()">+ log something manually</div>
    </div>`;
}

function openAddToRecap(){
  const opts=tracks.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Log to recap</div><div class="modal-close" onclick="closeModal()">×</div></div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.5">Use when you accomplish something outside the dashboard — another chat, a call, anywhere.</div>
      <div class="modal-field"><div class="modal-label">What did you do?</div><textarea class="modal-textarea" id="rl-t" placeholder="e.g. Had a great discovery call, validated the core pain point" autofocus></textarea></div>
      <div class="modal-field"><div class="modal-label">Track</div><select class="modal-select" id="rl-tr"><option value="">No specific track</option>${opts}</select></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveManualLog()">Log it</button></div>
    </div>
  </div>`);
  setTimeout(()=>document.getElementById('rl-t')?.focus(),50);
}

async function saveManualLog(){
  const text=document.getElementById('rl-t').value.trim();if(!text)return;
  const l={id:'l'+Date.now(),text,trackId:document.getElementById('rl-tr').value,type:'manual',date:todayKey(),source:'dashboard'};
  recapLogs.push(l);await insertRecapLog(l);closeModal();openRecap();
}

init();
</script>
</body>
